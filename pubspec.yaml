name: expense_tracker
description: "Automatic expense tracker with Rooms (India, on-device only)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# The message parser is a pure-Dart package of its own (spec §7), so a stray
# Flutter import in it is a build error.
workspace:
  - packages/txn_parser

dependencies:
  clock: ^1.1.3
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  meta: ^1.19.0
  sqlite3: ^3.9.1
  txn_parser: ^0.0.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  test: ^1.31.1
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  # Bundled, never fetched at runtime (docs/DESIGN.md, "Type"). One variable
  # file: FontWeight drives its weight axis. Licence: AnekLatin-OFL.txt.
  fonts:
    - family: Anek Latin
      fonts:
        - asset: assets/fonts/AnekLatin-Variable.ttf
  assets:
    - assets/fonts/AnekLatin-OFL.txt
  generate: true
