name: expense_tracker
description: "Automatic expense tracker with Rooms (India, on-device only)."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.7

# The message parser is a pure-Dart package of its own (spec §7), so a stray
# Flutter import in it is a build error.
workspace:
  - packages/txn_parser

dependencies:
  app_links: ^7.2.2
  clock: ^1.1.3
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  txn_parser: ^0.0.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  test: ^1.31.1
  very_good_analysis: ^11.0.0
# The database is encrypted with SQLite3MultipleCiphers (spec §13): the
# same SQLite, with encryption, under the MIT licence and without OpenSSL.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  # Bundled, never fetched at runtime (docs/DESIGN.md, "Type"). One variable
  # file: FontWeight drives its weight axis. Licence: AnekLatin-OFL.txt.
  fonts:
    - family: Anek Latin
      fonts:
        - asset: assets/fonts/AnekLatin-Variable.ttf
  assets:
    - assets/fonts/AnekLatin-OFL.txt
  generate: true
